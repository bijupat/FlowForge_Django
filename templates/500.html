{% extends 'base.html' %}

{% block title %}Server Error - FlowForge{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm text-center">
                <div class="card-body p-5">
                    <i class="bi bi-exclamation-triangle text-danger display-1 mb-3"></i>
                    <h2 class="fw-bold text-danger">Server Error</h2>
                    <p class="text-muted mb-4">
                        An unexpected error occurred. Our team has been notified.<br>
                        Please try again later.
                    </p>
                    <a href="{% url 'core:dashboard' %}" class="btn btn-primary">
                        Go to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
